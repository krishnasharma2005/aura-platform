[project]
name = "aura-api"
version = "0.1.0"
description = "AURA backend API — AI business operating system for SMBs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "pyjwt>=2.10,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt<4.1",
    "openai>=1.55,<2.0",
    "google-genai>=1.0,<3.0",
    "tenacity>=9.0,<10.0",
    "pypdf>=5.1,<6.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "pyyaml>=6.0,<7.0",
    "email-validator>=2.2,<3.0",
    "google-api-python-client>=2.150,<3.0",
    "google-auth>=2.35,<3.0",
    "httpx>=0.27,<1.0",
    # Already present transitively (google-auth, pyjwt); declared explicitly
    # because src/core/crypto.py imports Fernet directly to encrypt integration
    # tokens at rest. No new package is actually installed by this line.
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    "fakeredis>=2.26,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# core/db.py's `engine`/`async_session_factory` are process-wide singletons
# created once at import time, not per-test. pytest-asyncio's default gives
# every test its own event loop, which asyncpg's connection pool can't
# tolerate (a pooled connection is bound to the loop it was opened on) —
# invisible under sqlite+aiosqlite (which the suite runs on by default), but
# it breaks the moment DATABASE_URL points at real Postgres, e.g. CI's
# postgres service or a manual local run against it: every test after the
# first errors with "Event loop is closed". One shared session-scoped loop
# matches how the engine itself is actually used.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
