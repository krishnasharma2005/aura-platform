# Reference Business Pack — the schema's first real example.
# Ported from dist/mesnium-business/packs-registry.js (BUILTIN_REAL_ESTATE_PACK)
# in the openclaw/claw fork, adapted to this codebase's six base agents and
# its workflow engine (src/workflows/).
#
# Activating this pack tunes the agents (see src/agents/runtime/effective_config.py)
# and installs the workflow below, switched off, for the owner to enable.
id: pack_real_estate
name: Real Estate Business Pack
version: 1.0.0
category: real_estate
description: >-
  Tunes the base agent workforce for real estate brokerages, property teams,
  and residential advisory — buyer intake, showing coordination, and
  Fair-Housing-aware marketing copy.

capability_requirements:
  - calendar
  - crm

agent_overrides:
  receptionist:
    extra_system_prompt: |
      This business is a real estate brokerage. When a prospective buyer or
      seller reaches out:
      - Ask for their budget range, desired location/neighborhood, and target
        move-in timeline before anything else.
      - Property showings need at least 2 hours' notice — never confirm a
        same-day showing without flagging it for a human to double-check
        agent availability.
      - Never state a property's final sale price, quote legal advice, or
        promise financing terms — hand those off to a human agent.
    extra_requires_approval:
      - calendar:create_event

  sales:
    extra_system_prompt: |
      Qualify buyers on: pre-approval status, budget, desired
      neighborhoods/property type, and timeline. Draft comparable market
      analysis (CMA) notes from listing data you're given — never invent
      comparable sales figures. If a buyer raises financing objections (e.g.
      a 2-1 buydown), address them factually and offer to loop in a human
      loan officer rather than giving financial advice yourself. When a buyer
      is ready, you may propose a private property tour directly.
    # The base Sales agent has no calendar access — scheduling showings is
    # specific to this vertical, so the pack adds it rather than it being on
    # every business's Sales agent by default.
    extra_allowed_tools:
      - calendar
    extra_requires_approval:
      - calendar:create_event

  marketing:
    extra_system_prompt: |
      All copy must comply with Fair Housing rules: never reference or imply
      preference based on race, religion, family status, disability, or
      national origin — describe the property and neighborhood amenities,
      never the "type" of person who belongs there. Lean on lifestyle framing
      (walkability, schools, commute) for listing and open-house campaigns.

  executive_assistant:
    extra_system_prompt: |
      When compiling briefings for this business, prioritize: closed sales
      volume, average days on market (DOM), active listing pipeline, and
      commission forecasting over generic inbox/calendar summaries.

# Installed (switched off) on activation. Uses the engine's real step vocabulary
# (src/workflows/steps.py); validated when the pack loads.
workflow_templates:
  - slug: real-estate-buyer-enquiry
    name: Buyer enquiry follow-up
    description: >-
      Watches new messages for property enquiries (buying, selling, viewings,
      valuations). When one comes in, Sales pulls out what the person is looking
      for and the enquiry is flagged in your Activity feed for an agent to pick up.
    trigger_type: event
    trigger_config:
      event: conversation.message_received
      channels: [web_chat, whatsapp]
    steps:
      - id: is_property_enquiry
        name: Is this a property enquiry?
        type: branch
        check: message_matches_keywords
        params:
          keywords:
            - buy
            - buying
            - sell
            - selling
            - viewing
            - valuation
            - mortgage
            - listing
            - property
            - house
            - flat
            - apartment
        on_false: stop
      - id: summarise_lead
        name: Pull out what they are looking for
        type: agent
        agent: sales
        optional: true
        conversation_key: "workflow-lead-{{run_id}}"
        prompt: >-
          A prospective buyer or seller wrote: "{{last_message}}". In two short
          sentences, note what they want (buying or selling, area, budget,
          timeline) and what is still missing. Do not invent anything they did
          not say.
      - id: flag_for_agent
        name: Flag it for an agent
        type: escalate
        reason: "New property enquiry ready for an agent to follow up. {{steps.summarise_lead.response}}"
