<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Website chat preview</title>
<meta name="robots" content="noindex" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      linear-gradient(0deg, rgba(0,0,0,.02), rgba(0,0,0,.02)),
      repeating-linear-gradient(45deg, #f3f4f2, #f3f4f2 12px, #eceae6 12px, #eceae6 24px);
    color: #6b7280;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  p { max-width: 22rem; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
  <p>This stands in for your website. The chat bubble in the corner is exactly what your visitors will see.</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var org = params.get("org");
      var api = params.get("api");
      if (!org || !api) return;
      var s = document.createElement("script");
      s.src = "/widget.js";
      s.setAttribute("data-org", org);
      s.setAttribute("data-api", api);
      s.defer = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
