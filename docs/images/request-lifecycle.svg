<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="Request lifecycle: a customer message passes through tenant resolution, memory and knowledge, planning, a permission and approval gate, then tool execution, with consequential actions diverted to an owner approval queue.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8a86"/>
    </marker>
    <marker id="a2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8721f"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #16211f; }
    .lbl { font-size: 12.5px; font-weight: 600; }
    .sub { font-size: 10.5px; fill: #5d6b67; }
    .eye { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: .09em; fill: #7d8a86; }
    .box { fill: #ffffff; stroke: #d5ddd9; stroke-width: 1.2; }
    .gate{ fill: #fdf6ee; stroke: #d8b782; stroke-width: 1.5; }
    .ln  { stroke: #a9b5b1; stroke-width: 1.3; fill: none; }
    .lnw { stroke: #a8721f; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .elbl{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #6b7975; }
  </style>

  <text class="t eye" x="30" y="30">ONE PIPELINE — DASHBOARD, WEBSITE WIDGET AND WHATSAPP ALL ENTER HERE</text>

  <rect class="box" x="30" y="52" width="150" height="58" rx="8"/>
  <text class="t lbl" x="46" y="76">Customer message</text>
  <text class="t sub" x="46" y="93">A stranger, or the owner</text>

  <line class="ln" x1="180" y1="81" x2="222" y2="81" marker-end="url(#a2)"/>

  <rect class="box" x="222" y="52" width="150" height="58" rx="8"/>
  <text class="t lbl" x="238" y="76">Resolve tenant</text>
  <text class="t sub" x="238" y="93">Which business is this?</text>

  <line class="ln" x1="372" y1="81" x2="414" y2="81" marker-end="url(#a2)"/>

  <rect class="box" x="414" y="52" width="164" height="58" rx="8"/>
  <text class="t lbl" x="430" y="76">Load context</text>
  <text class="t sub" x="430" y="93">Memory + your documents</text>

  <line class="ln" x1="578" y1="81" x2="620" y2="81" marker-end="url(#a2)"/>

  <rect class="box" x="620" y="52" width="164" height="58" rx="8"/>
  <text class="t lbl" x="636" y="76">Decide a reply</text>
  <text class="t sub" x="636" y="93">Answer, or reach for a tool</text>

  <path class="ln" d="M702 110 L702 150" marker-end="url(#a2)"/>
  <text class="t elbl" x="712" y="134">wants a tool</text>

  <!-- gate -->
  <rect class="gate" x="470" y="152" width="314" height="66" rx="9"/>
  <text class="t lbl" x="490" y="176" style="fill:#7a4f14">Permission + approval gate</text>
  <text class="t sub" x="490" y="194" style="fill:#8a6431">Checked against YAML the model cannot influence.</text>
  <text class="t sub" x="490" y="209" style="fill:#8a6431">A malicious message can ask; it cannot make it run.</text>

  <!-- consequential branch -->
  <path class="lnw" d="M470 185 L300 185" marker-end="url(#a2w)"/>
  <text class="t elbl" x="330" y="177" style="fill:#a8721f">consequential</text>

  <rect class="gate" x="120" y="152" width="180" height="66" rx="9"/>
  <text class="t lbl" x="138" y="176" style="fill:#7a4f14">Waits for the owner</text>
  <text class="t sub" x="138" y="194" style="fill:#8a6431">Queued, not sent.</text>
  <text class="t sub" x="138" y="209" style="fill:#8a6431">Nothing happens until approved.</text>

  <!-- safe path -->
  <path class="ln" d="M660 218 L660 258" marker-end="url(#a2)"/>
  <text class="t elbl" x="670" y="242">allowed</text>

  <rect class="box" x="560" y="260" width="200" height="56" rx="8"/>
  <text class="t lbl" x="578" y="283">Tool runs</text>
  <text class="t sub" x="578" y="300">Calendar, inbox, CRM, store</text>

  <path class="ln" d="M560 288 L420 288" marker-end="url(#a2)"/>
  <rect class="box" x="240" y="260" width="180" height="56" rx="8"/>
  <text class="t lbl" x="258" y="283">Reply sent</text>
  <text class="t sub" x="258" y="300">Plus what it did, in plain words</text>

  <path class="ln" d="M330 316 L330 352" marker-end="url(#a2)"/>

  <rect x="30" y="354" width="880" height="52" rx="9" fill="#f4f7f5" stroke="#e2e9e5" stroke-width="1"/>
  <text class="t lbl" x="50" y="378">Written to Activity — and to a durable transcript</text>
  <text class="t sub" x="50" y="396">Every message, tool call, approval and escalation. The owner can read back what happened while they were with a customer.</text>
</svg>
